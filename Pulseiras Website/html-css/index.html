<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knots by Nuts - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="imagens/imagem.png" alt="Knots by Nuts" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-center" id="navLinks">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Página Inicial</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="add.html">➕ Novo Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="ShoopingCart.html">🛒 Carrinho</a></li>
                    <li class="nav-item"><a class="nav-link" href="LogInCreateAccount.html">🔐 Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-white py-5 mt-5 border-bottom text-center">
        <div class="container py-4">
            <h1 class="display-4 fw-bold text-dark">Knots by Nuts</h1>
            <p class="lead text-muted">Pulseiras artesanais feitas à mão com paixão e estilo único.</p>
            <a href="produtos.html" class="btn btn-primary btn-lg px-4 shadow">Ver Coleção</a>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <h2 class="text-warning fw-bold mb-4 text-center">⭐ Os Nossos Top Products</h2>
            <div id="listaTopProdutos" class="row g-4"></div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-auto border-top">
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 Knots by Nuts. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        const API_URL = "http://localhost:3000/produtos";

        async function carregarTopProdutos() {
            try {
                const response = await fetch(API_URL);
                const produtos = await response.json();
                const container = document.getElementById("listaTopProdutos");
                container.innerHTML = "";

                for (var i = 0; i < produtos.length; i++) {
                    var p = produtos[i];
                    if (p.score >= 3) {
                        container.innerHTML += '<div class="col-sm-6 col-lg-4">' +
                            '<div class="card h-100 shadow-sm border-0">' +
                                '<a href="produto.html?id=' + p.id + '">' +
                                    '<img src="' + p.img + '" class="card-img-top bg-light" style="height: 220px; object-fit: cover;">' +
                                '</a>' +
                                '<div class="card-body d-flex flex-column">' +
                                    '<h5 class="card-title fw-bold">' + p.nome + '</h5>' +
                                    '<p class="card-text mb-2 text-warning">⭐ Score: ' + p.score + '/5</p>' +
                                    '<p class="card-text fw-bold text-dark fs-5 mb-3">' + p.preco_eur.toFixed(2) + '€</p>' +
                                    '<a href="produto.html?id=' + p.id + '" class="btn btn-outline-primary mt-auto">Ver Detalhes</a>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                    }
                }
            } catch (error) {
                console.error(error);
            }
        }

        function verificarNavbar() {
            const user = localStorage.getItem("utilizador");
            if(user) {
                document.getElementById("navLinks").innerHTML = `
                    <li class="nav-item"><a class="nav-link active" href="index.html">Página Inicial</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="add.html">➕ Novo Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="ShoopingCart.html">🛒 Carrinho</a></li>
                    <li class="nav-item"><span class="nav-link text-warning fw-bold">👋 ${user}</span></li>
                    <li class="nav-item"><button onclick="logout()" class="btn btn-sm btn-outline-danger ms-2">Sair</button></li>
                `;
            }
        }
        function logout() {
            localStorage.removeItem("utilizador");
            window.location.reload();
        }

        verificarNavbar();
        carregarTopProdutos();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
