<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Login - Knots by Nuts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="imagens/imagem.png" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-center" id="navLinks">
                    <li class="nav-item"><a class="nav-link" href="index.html">Página Inicial</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="add.html">➕ Novo Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="ShoopingCart.html">🛒 Carrinho</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">🔐 Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5 mb-5" style="max-width: 450px;">
        <div class="card p-4 shadow-sm border-0 bg-white mt-5">
            <h2 class="fw-bold text-center mb-4">🔐 Área de Membro</h2>
            <form onsubmit="efetuarLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nome de Utilizador</label>
                    <input type="text" id="username" class="form-control" placeholder="Ex: admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Palavra-passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        function efetuarLogin(event) {
            event.preventDefault();
            const user = document.getElementById("username").value;
            
            // Guarda o utilizador no localStorage
            localStorage.setItem("utilizador", user);
            alert("Login efetuado com sucesso! Bem-vindo, " + user);
            
            // Redireciona para a página inicial
            window.location.href = "index.html";
        }

        // Sistema básico para atualizar a barra se já estiver logado
        function verificarNavbar() {
            const user = localStorage.getItem("utilizador");
            if(user) {
                document.getElementById("navLinks").innerHTML = `
                    <li class="nav-item"><a class="nav-link" href="index.html">Página Inicial</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="add.html">➕ Novo Produto</a></li>
                    <li class="nav-item"><a class="nav-link" href="ShoopingCart.html">🛒 Carrinho</a></li>
                    <li class="nav-item"><span class="nav-link text-warning fw-bold">👋 ${user}</span></li>
                    <li class="nav-item"><button onclick="logout()" class="btn btn-sm btn-outline-danger ms-2">Sair</button></li>
                `;
            }
        }
        function logout() {
            localStorage.removeItem("utilizador");
            window.location.reload();
        }
        verificarNavbar();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
