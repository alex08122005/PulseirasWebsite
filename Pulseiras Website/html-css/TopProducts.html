<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knots by Nuts - Top Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../imagens/imagem.png" alt="Knots by Nuts" height="40" class="d-inline-block align-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Página Inicial</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Top Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="ShoopingCart.html">Carrinho</a></li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-info fw-bold" href="LogInCreateAccount.html">👤 Entrar</a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-success btn-sm mt-2 mt-lg-0" href="Add.html">➕ Novo Produto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="bg-white py-5 mt-5 border-bottom">
        <div class="container text-center">
            <h1 class="display-5 fw-bold text-warning">⭐ Os Nossos Top Products</h1>
            <p class="lead">Apenas as pulseiras mais bem avaliadas pelos nossos clientes.</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div id="listaTopProdutos" class="row g-4"></div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        var produtos = [
            { "id": 1, "nome": "Pulseira Oceano Azul", "tamanho_cm": 16, "padrao": "Ondas", "preco_eur": 12.50, "score": 5, "img": "../imagens/OceanBreeze.png" },
            { "id": 2, "nome": "Pulseira Tribal Sol", "tamanho_cm": 18, "padrao": "Tribal", "preco_eur": 15.90, "score": 3, "img": "../imagens/SunsetGlow.png" },
            { "id": 3, "nome": "Pulseira Natureza Viva", "tamanho_cm": 17, "padrao": "Folhas", "preco_eur": 10.00, "score": 4, "img": "../imagens/ForestWalk.png" },
            { "id": 4, "nome": "Pulseira Aurora", "tamanho_cm": 19, "padrao": "Geométrico", "preco_eur": 18.75, "score": 2, "img": "../imagens/LilacDream.png" },
            { "id": 5, "nome": "Pulseira Sunset", "tamanho_cm": 15, "padrao": "Gradiente", "preco_eur": 9.50, "score": 2, "img": "../imagens/SunsetGlow.png" },
            { "id": 6, "nome": "Pulseira Elegance", "tamanho_cm": 18, "padrao": "Minimalista", "preco_eur": 22.00, "score": 4, "img": "../imagens/ForestWalk.png" },
            { "id": 7, "nome": "Pulseira Festival", "tamanho_cm": 20, "padrao": "Étnico", "preco_eur": 19.90, "score": 2, "img": "../imagens/SunsetGlow.png" },
            { "id": 8, "nome": "Pulseira Pérola Lunar", "tamanho_cm": 16, "padrao": "Pérolas", "preco_eur": 25.00, "score": 4, "img": "../imagens/LilacDream.png" },
            { "id": 9, "nome": "Pulseira Neon Style", "tamanho_cm": 17, "padrao": "Zigue-zague", "preco_eur": 14.40, "score": 5, "img": "../imagens/OceanBreeze.png" },
            { "id": 10, "nome": "Pulseira Vintage", "tamanho_cm": 18, "padrao": "Floral", "preco_eur": 16.80, "score": 2, "img": "../imagens/ForestWalk.png" },
            { "id": 11, "nome": "Pulseira Cristal Shine", "tamanho_cm": 15, "padrao": "Cristais", "preco_eur": 27.30, "score": 4, "img": "../imagens/LilacDream.png" },
            { "id": 12, "nome": "Pulseira Casual Day", "tamanho_cm": 17, "padrao": "Listras", "preco_eur": 8.99, "score": 2, "img": "../imagens/OceanBreeze.png" },
            { "id": 13, "nome": "Pulseira Boho Chic", "tamanho_cm": 19, "padrao": "Mandala", "preco_eur": 21.50, "score": 3, "img": "../imagens/SunsetGlow.png" },
            { "id": 14, "nome": "Pulseira Infinity", "tamanho_cm": 16, "padrao": "Infinito", "preco_eur": 17.20, "score": 3, "img": "../imagens/LilacDream.png" },
            { "id": 15, "nome": "Pulseira Tropical", "tamanho_cm": 20, "padrao": "Palmeiras", "preco_eur": 13.75, "score": 5, "img": "../imagens/OceanBreeze.png" }
        ];

        var dadosGuardados = localStorage.getItem("produtosCriados");
        if (dadosGuardados != null) {
            var produtosAdicionais = JSON.parse(dadosGuardados);
            for (var k = 0; k < produtosAdicionais.length; k++) {
                produtos.push(produtosAdicionais[k]);
            }
        }

        var containerTop = document.getElementById("listaTopProdutos");

        for (var i = 0; i < produtos.length; i++) {
            var p = produtos[i];
            if (p.score >= 3) { 
                containerTop.innerHTML += '<div class="col-sm-6 col-lg-4">' +
                    '<div class="card h-100 shadow-sm border-0">' +
                        '<img src="' + p.img + '" class="card-img-top bg-light" style="height: 220px; object-fit: cover;">' +
                        '<div class="card-body d-flex flex-column">' +
                            '<h5 class="card-title fw-bold">' + p.nome + '</h5>' +
                            '<p class="card-text mb-1 small text-muted"><strong>Padrão:</strong> ' + p.padrao + '</p>' +
                            '<p class="card-text mb-2 text-warning">⭐ Score: ' + p.score + '/5</p>' +
                            '<p class="card-text fw-bold text-dark fs-5 mb-3">' + p.preco_eur.toFixed(2) + '€</p>' +
                            '<button class="btn btn-primary mt-auto" onclick="comprarEIrParaCarrinho(' + p.id + ', \'' + p.nome + '\', ' + p.preco_eur + ')">Comprar</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }
        }

        function comprarEIrParaCarrinho(id, nome, preco) {
            var dadosCarrinho = localStorage.getItem("carrinho");
            var carrinho = [];
            if (dadosCarrinho != null) {
                carrinho = JSON.parse(dadosCarrinho);
            }
            carrinho.push({ id: id, nome: nome, preco: preco });
            localStorage.setItem("carrinho", JSON.stringify(carrinho));
            window.location.href = "ShoopingCart.html";
        }
    </script>
</body>
</html>
