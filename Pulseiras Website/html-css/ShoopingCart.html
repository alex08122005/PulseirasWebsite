<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 O Meu Carrinho - Knots by Nuts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="imagens/imagem.png" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Página Inicial</a></li>
                    <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="add.html">➕ Novo Produto</a></li>
                    <li class="nav-item"><a class="nav-link active" href="ShoopingCart.html">🛒 Carrinho</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5 mb-5">
        <div class="card shadow border-0 p-4 bg-white mt-4">
            <h2 class="fw-bold mb-4">🛒 O Meu Carrinho de Compras</h2>
            
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="corpoCarrinho">
                        </tbody>
                </table>
            </div>

            <div class="d-flex flex-column align-items-end mt-4">
                <h4><strong>Total do Carrinho:</strong> <span id="precoTotal" class="text-primary">0.00€</span></h4>
                <div class="mt-3">
                    <a href="produtos.html" class="btn btn-outline-dark me-2">Continuar a Comprar</a>
                    <button class="btn btn-primary px-4 shadow" onclick="finalizarCompra()">Finalizar Compra</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-auto border-top">
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 Knots by Nuts. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        function carregarCarrinho() {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            const tbody = document.getElementById("corpoCarrinho");
            const precoTotalTxt = document.getElementById("precoTotal");
            
            tbody.innerHTML = "";
            let total = 0;

            if (carrinho.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4">O teu carrinho está vazio!</td></tr>`;
                precoTotalTxt.innerText = "0.00€";
                return;
            }

            for (let i = 0; i < carrinho.length; i++) {
                let p = carrinho[i];
                total += p.preco_eur;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center">
                                <img src="${p.img}" class="rounded me-3" style="width: 60px; height: 60px; object-fit: cover;">
                                <div>
                                    <h6 class="fw-bold mb-0">${p.nome}</h6>
                                    <small class="text-muted">Categoria: ${p.categoria}</small>
                                </div>
                            </div>
                        </td>
                        <td class="fw-bold">${p.preco_eur.toFixed(2)}€</td>
                        <td>
                            <button onclick="removerDoCarrinho(${i})" class="btn btn-danger btn-sm">❌ Remover</button>
                        </td>
                    </tr>
                `;
            }

            precoTotalTxt.innerText = total.toFixed(2) + "€";
        }

        function removerDoCarrinho(index) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            
            // Remover o elemento na posição do clique
            carrinho.splice(index, 1);
            
            // Guardar a lista atualizada
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            
            // Atualizar o ecrã imediatamente
            carregarCarrinho();
        }

        function finalizarCompra() {
            alert('Pedido Finalizado com Sucesso!');
            localStorage.removeItem('carrinho'); // Limpa o carrinho após finalizar
            carregarCarrinho();
        }

        // Executa automaticamente quando abre a página
        carregarCarrinho();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
